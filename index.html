<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FlowLab — Simulador Kanban v8.1</title>
<meta name="author" content="Prof. Ari Amaral"/>
<meta name="description" content="FlowLab — simulador de gestão de fluxo Kanban. Jogo criado por Prof. Ari Amaral."/>
<!-- FlowLab v8.1 — ranks recalibrados, eficiencia de fluxo corrigida, violacao de WIP corrigida, banca recalibrada, localStorage protegido -->
<style>
:root{
  --bg:#07111f;--panel:#0f1d31;--panel2:#13243c;--ink:#eaf2ff;--muted:#8fa6c6;
  --accent:#ffd166;--good:#3ddc97;--warn:#ff9f43;--bad:#ff5d73;--blue:#4dabf7;--violet:#b197fc;
  --line:#243b5a;--card:#ffffff;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#07111f,#0b1627);color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app{min-height:100vh}
.topbar{position:sticky;top:0;z-index:30;background:rgba(7,17,31,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-weight:900;font-size:22px;letter-spacing:-.5px}.brand b{color:var(--accent)}
.pill{background:#11233b;border:1px solid #243b5a;border-radius:999px;padding:6px 10px;font-size:12px}
.pill strong{color:#fff}
.primary{background:var(--accent);color:#111827;border:none;border-radius:10px;padding:10px 16px;font-weight:900}
.ghost{background:#12233b;color:#dbeafe;border:1px solid #2d4668;border-radius:9px;padding:8px 12px}
.danger{background:#ef476f;color:#fff;border:none;border-radius:9px;padding:8px 12px}
.container{padding:14px}
.hero{max-width:1080px;margin:28px auto;padding:28px;border:1px solid #274264;background:linear-gradient(135deg,#0e2037,#132b49);border-radius:24px;box-shadow:0 30px 70px rgba(0,0,0,.3)}
.hero h1{font-size:48px;line-height:1.02;margin:0 0 12px}.hero h1 span{color:var(--accent)}
.hero p{color:#b9c9e0;line-height:1.7}
.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.panel h3,.panel h4{margin:0 0 8px}
label{display:block;font-size:12px;color:#9fb0c9;margin:9px 0 4px}
input,select{width:100%;background:#091627;color:#eef6ff;border:1px solid #314b70;border-radius:9px;padding:10px}
.kpis{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.kpi{background:#0d1c30;border:1px solid #243b5a;border-radius:12px;padding:8px 10px;min-width:110px}
.kpi small{display:block;color:#8ea6c5;font-size:10px}.kpi b{font-size:18px}
.board-wrap{overflow-x:auto;padding-bottom:8px}
.board{display:flex;gap:8px;min-width:1750px}
.col{width:150px;flex:0 0 150px;background:#0d1b2d;border:1px solid #28415f;border-radius:14px;min-height:430px}
.col.over{outline:3px solid var(--bad)}
.col-head{padding:9px;border-bottom:1px dashed #355273;min-height:86px}
.group{font-size:9px;letter-spacing:.9px;text-transform:uppercase;color:#8da8cb}
.col-title{font-size:12px;font-weight:800;line-height:1.25;margin-top:4px}
.wipctl{display:flex;align-items:center;gap:5px;margin-top:7px}
.mini{width:22px;height:22px;border:1px solid #375477;background:#13253e;color:#dbeafe;border-radius:6px}
.count{font-size:11px;font-weight:800}
.card-list{padding:7px;display:flex;flex-direction:column;gap:7px}
.work{background:#fff;color:#172033;border-radius:9px;padding:8px;border-left:7px solid #64748b;box-shadow:0 4px 12px rgba(0,0,0,.2);font-size:11px;transition:.15s;cursor:pointer}
.work:hover{transform:translateY(-2px)}
.work h5{margin:0 0 4px;font-size:12px;line-height:1.2}
.tags{display:flex;gap:4px;flex-wrap:wrap}.tag{font-size:9px;background:#e9eef5;border-radius:5px;padding:2px 4px}
.work.blocked{outline:2px dashed #e03131}
/* --- drag & drop --- */
.work{touch-action:pan-x pan-y}
.work.is-source{opacity:.35;filter:grayscale(.5)}
.drag-ghost{position:fixed;z-index:9999;pointer-events:none;width:136px;transform:translate(-50%,-50%) rotate(2.5deg) scale(1.04);box-shadow:0 18px 40px rgba(0,0,0,.55);opacity:.96}
.col.drop-ok{outline:3px solid var(--good);background:#0f2a24}
.col.drop-ok .col-head{background:rgba(61,220,151,.12)}
.col.drop-no{outline:3px solid var(--bad);background:#2a1420}
.dragging-active{user-select:none;-webkit-user-select:none}
.dragging-active .board-wrap{touch-action:none}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:10000;background:#12233b;color:#eaf2ff;border:1px solid #2d4668;border-left:6px solid var(--accent);border-radius:12px;padding:12px 16px;font-size:13px;max-width:92vw;box-shadow:0 14px 40px rgba(0,0,0,.5);animation:toastIn .18s ease-out}
.toast.bad{border-left-color:var(--bad)}.toast.good{border-left-color:var(--good)}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.credit{font-size:12px;color:#8fa6c6;margin:-4px 0 12px;letter-spacing:.02em}
.credit b{color:#cfe0f5;font-weight:700}
.brand .by{display:block;font-size:9.5px;font-weight:600;color:#8fa6c6;letter-spacing:.02em;margin-top:-2px}
.cinfo{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;margin-left:5px;border-radius:50%;background:#ffffff2e;border:1px solid #ffffff45;color:#fff;font-size:10px;font-weight:800;cursor:pointer;vertical-align:middle;touch-action:manipulation}
.cinfo:hover{background:#ffffff5c}
ul.crit{margin:0;padding-left:18px}
ul.crit li{font-size:12.5px;line-height:1.6;margin-bottom:4px;color:#dbeafe}
.critrow ul.crit li{color:#334155}
.critrow{border:1px solid #e2e8f0;border-left-width:4px;border-left-color:#cbd5e1;border-radius:9px;padding:10px 12px;margin-bottom:8px;background:#fff}
.critrow.is-q{border-left-color:#16a34a;background:#f7fdfa}
.crith{font-size:13px;color:#0f172a;margin-bottom:6px}
.critr{display:block;font-size:11px;color:#64748b;font-weight:600;margin-top:2px}
.critn{font-size:11.5px;color:#475569;background:#f4f8fc;border-radius:7px;padding:7px 9px;margin-top:7px;line-height:1.5}
.cvverdict{border-radius:9px;padding:10px 12px;font-size:13px;line-height:1.5}
.cv-good{background:#e6f7ee;border:1px solid #86e0b0;color:#14532d}
.cv-warn{background:#fff4e0;border:1px solid #f0cf8e;color:#7c4a03}
.cv-bad{background:#fdecef;border:1px solid #f3a8b5;color:#7f1d1d}
.hired{background:#f4f8fc;border:1px solid #dbe6f2;border-radius:9px;padding:9px 11px;font-size:12px;color:#334155;line-height:1.6}
.cands{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px}
.cand{border:1px solid #d8e1ed;border-radius:11px;padding:12px;background:#fbfdff}
.cand-h{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.cand-h b{font-size:14px;color:#0f172a;display:block}
.cand-h small{font-size:11px;color:#64748b}
.cand-p{margin-left:auto;text-align:right;font-size:13px;font-weight:800;color:#0f172a}
.cand-p small{display:block;font-size:10px;font-weight:600;color:#64748b}
.cand-b{font-size:12px;color:#475569;line-height:1.5;margin-bottom:6px}
.cand-s{font-size:11.5px;color:#334155;margin-bottom:6px}
.cand-r{font-size:11.5px;background:#eef4fd;border-radius:7px;padding:7px 9px;color:#1e3a5f;line-height:1.5;margin-bottom:8px}
.cand-c{font-size:11px;color:#64748b;margin-bottom:9px}
.cand button{width:100%}
.banca{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px;margin-bottom:16px}
.expert2{border:1px solid #d8e1ed;border-left-width:5px;border-radius:11px;padding:12px 14px;background:#fbfdff}
.expert2.ex-good{border-left-color:#16a34a}.expert2.ex-warn{border-left-color:#f59f00}.expert2.ex-bad{border-left-color:#e03131}
.ex-h{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.ex-ic{font-size:22px;line-height:1}
.ex-h b{font-size:14px;color:#0f172a;display:block}
.ex-h small{font-size:11px;color:#64748b}
.ex-tag{margin-left:auto;font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;background:#eef3f9;color:#475569;white-space:nowrap}
.ex-good .ex-tag{background:#e6f7ee;color:#15803d}.ex-warn .ex-tag{background:#fff4e0;color:#b45309}.ex-bad .ex-tag{background:#fdecef;color:#b91c1c}
.ex-v{font-size:11.5px;font-family:ui-monospace,monospace;color:#334155;background:#f1f6fb;border-radius:7px;padding:6px 9px;margin-bottom:8px;line-height:1.5}
.ex-d{font-size:12.5px;line-height:1.6;color:#334155;margin-bottom:9px}
.ex-t,.ex-c{font-size:12.5px;line-height:1.6;border-radius:8px;padding:8px 10px;margin-top:7px}
.ex-t{background:#fff8e6;border:1px solid #f0dcae;color:#5c4708}
.ex-c{background:#eef4fd;border:1px solid #cfdff5;color:#1e3a5f}
.ex-t small,.ex-c small{display:block;font-size:9.5px;font-weight:800;letter-spacing:.08em;margin-bottom:3px;opacity:.75}
.trilha{border:1px solid #d8e1ed;border-radius:12px;padding:14px;background:#f7fbff;margin-bottom:14px}
.trilha h4{margin:0 0 10px;font-size:14px;color:#0f172a}
.tr-i{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid #e6edf6}
.tr-i:last-child{border-bottom:0}
.tr-n{flex:0 0 22px;height:22px;border-radius:50%;background:#2563eb;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.tr-i b{font-size:12.5px;color:#0f172a;display:block}
.tr-i span{font-size:11.5px;color:#475569;line-height:1.5}
.refs{border:1px solid #d8e1ed;border-radius:12px;padding:14px;background:#fbfdff}
.refs h4{margin:0 0 8px;font-size:14px;color:#0f172a}
.ref-i{padding:6px 0;border-bottom:1px solid #eef3f9;font-size:12px}
.ref-i:last-child{border-bottom:0}
.ref-i b{color:#0f172a}
.ref-a{color:#2563eb;margin-left:6px}
.ref-s{display:block;color:#64748b;font-size:11px;margin-top:2px}
.clegend{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.cl-item{display:inline-flex;align-items:center;gap:5px;background:#0d1b2d;border:1px solid #28415f;border-radius:999px;padding:3px 10px 3px 4px;font-size:11px;color:#dbeafe}
.cl-item i{width:12px;height:12px;border-radius:50%;display:inline-block;flex:0 0 12px}
.cl-w{background:#5b1220;color:#ff9aa8;border-radius:4px;padding:1px 5px;font-size:9.5px;font-weight:800;letter-spacing:.03em}
.cl-more{font-size:10.5px;color:#7f95b3;margin-left:2px}
.cltable{display:flex;flex-direction:column;gap:8px}
.clrow{border:1px solid #d8e1ed;border-left-width:5px;border-radius:9px;padding:9px 12px;background:#fbfdff}
.clh{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:13px;color:#0f172a}
.cldot{width:11px;height:11px;border-radius:50%;display:inline-block}
.clcount{margin-left:auto;font-size:11px;color:#64748b}
.clb{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin-top:7px}
.clb span{font-size:11.5px;line-height:1.5;color:#334155}
.clb small{display:block;font-size:9.5px;letter-spacing:.07em;color:#94a3b8;font-weight:800;margin-bottom:2px}
.hint{font-size:11px;color:#8fa6c6;padding:0 2px 6px}
/* --- detalhe do cartão --- */
.info{float:right;cursor:pointer;font-size:12px;line-height:1;padding:5px 6px;margin:-4px -4px 0 4px;border-radius:7px;background:#ffffff1a;border:1px solid #ffffff2e;color:#fff;opacity:.85;min-width:26px;min-height:26px;display:inline-flex;align-items:center;justify-content:center;touch-action:manipulation}
.info:hover,.info:active{opacity:1;background:#ffffff33}
.tag-val{background:#1c3b2e;color:#3ddc97;border-color:#2b6b50}
.tag-bv{background:#13314a;color:#7cc4ff;border-color:#2a5a80;font-weight:800}
.tag-tech{background:#2b2438;color:#c4b5fd;border-color:#4c3f66}
.steps{margin:0;padding-left:20px}.steps li{font-size:12.5px;line-height:1.6;color:#dbeafe;margin-bottom:3px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp>div{border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.5}
.cmp small{display:block;font-size:9.5px;letter-spacing:.08em;margin-bottom:4px;opacity:.85}
.cmp-ok{background:#122e22;border:1px solid #2b6b50;color:#c9f2e0}
.cmp-no{background:#341820;border:1px solid #7a3040;color:#ffd6dd}
.bv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.bv>div{background:#12233b;border:1px solid #2d4668;border-radius:8px;padding:8px 10px}
.bv small{display:block;font-size:9.5px;color:#8fa6c6;letter-spacing:.05em;margin-bottom:3px}
.bv b{font-size:17px}
.tag-dep{background:#3a2d15;color:#f59f00;border-color:#6b5324}
.dialog.detail{max-width:640px;width:94vw;max-height:88vh;display:flex;flex-direction:column;padding:0;background:#0f1e33;border:1px solid #2d4668}
.dhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid #22364f;position:sticky;top:0;background:#0f1e33;border-radius:12px 12px 0 0}
.dhead h3{margin:6px 0 0;font-size:17px;color:#eaf2ff}
.dclose{background:#1b2f4a;border:1px solid #2d4668;color:#cfe0f5;border-radius:8px;width:30px;height:30px;font-size:14px;cursor:pointer;flex:0 0 30px}
.dbody{overflow-y:auto;padding:4px 16px 18px;-webkit-overflow-scrolling:touch}
.dbody section{padding:12px 0;border-bottom:1px solid #1c2e46}
.dbody section:last-child{border-bottom:0}
.dbody h6{margin:0 0 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#8fa6c6}
.dbody p{margin:0;font-size:13px;line-height:1.5;color:#dbeafe}
.dbody ul{margin:0;padding-left:18px}.dbody li{font-size:12.5px;line-height:1.5;color:#dbeafe;margin-bottom:3px}
.dtab{width:100%;border-collapse:collapse;font-size:12.5px}
.dtab td{padding:5px 0;border-bottom:1px solid #17293f;color:#cfe0f5}
.dtab td:last-child{text-align:right;white-space:nowrap}
.dbody .good{color:#3ddc97}.dbody .bad{color:#ff6b81}.dbody .muted{color:#7f95b3}
.dialog.daily{max-width:720px}
.dfoot{padding:12px 16px;border-top:1px solid #22364f;text-align:right;background:#0f1e33;border-radius:0 0 12px 12px}
.alert{display:block;border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:12.5px;line-height:1.5}
.alert b{display:block;margin-bottom:2px}
.alert.d-bad{background:#341820;border-left:4px solid #ff6b81;color:#ffd6dd}
.alert.d-warn{background:#33290f;border-left:4px solid #f59f00;color:#ffe9b8}
.dcol{border:1px solid #1e3350;border-radius:9px;padding:8px 10px;margin-bottom:8px;background:#0c1a2c}
.dcol-h{font-size:12px;font-weight:800;color:#cfe0f5;margin-bottom:6px;padding-bottom:5px;border-bottom:1px dashed #24395a}
.ditem{padding:5px 0;border-bottom:1px solid #16273c}
.ditem:last-of-type{border-bottom:0}
.ditem-n{font-size:12.5px;color:#eaf2ff;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ditem-f{display:flex;gap:8px;flex-wrap:wrap;margin-top:3px;font-size:11px}
.d-bad{color:#ff6b81}.d-warn{color:#f59f00}.d-good{color:#3ddc97}.d-muted{color:#8fa6c6}
.dq{margin-top:7px;font-size:12px;color:#7cc4ff;background:#12233b;border-radius:7px;padding:6px 9px;line-height:1.5}
.matbar{border-radius:8px;padding:7px 10px;font-size:12px;font-weight:700}
.mat0{background:#33290f;color:#f59f00;border:1px solid #6b5324}
.mat1{background:#13314a;color:#7cc4ff;border:1px solid #2a5a80}
.mat2{background:#122e22;color:#3ddc97;border:1px solid #2b6b50}
.note{display:block;margin-top:8px;font-size:11px;color:#8fa6c6;line-height:1.5}
/* --- história de usuário e BDD --- */
.story{background:#132540;border-left:4px solid #4c8dff;border-radius:0 8px 8px 0;padding:10px 12px;font-size:13px;line-height:1.7;color:#eaf2ff}
.skw{color:#4c8dff;font-weight:800}
.scen{background:#0c1a2c;border:1px solid #1e3350;border-radius:8px;padding:9px 11px;margin-bottom:8px}
.scen:last-child{margin-bottom:0}
.scen-t{font-size:12px;font-weight:800;color:#cfe0f5;margin-bottom:6px;padding-bottom:5px;border-bottom:1px dashed #24395a}
.step{font-size:12.5px;line-height:1.6;color:#dbeafe;padding:1px 0}
.kw{display:inline-block;min-width:52px;font-weight:800;font-size:11px}
.kw-d{color:#4c8dff}.kw-q{color:#f59f00}.kw-e{color:#3ddc97}.kw-a{color:#7f95b3}
/* --- bancada de pessoas --- */
.tray{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:#0d1b2d;border:1px solid #28415f;border-radius:12px;padding:8px;margin-bottom:8px}
.tray-label{font-size:11px;font-weight:800;color:#8fa6c6;margin-right:4px}
.chip{display:flex;align-items:center;gap:6px;background:#12233b;border:1px solid #2d4668;border-radius:999px;padding:4px 10px 4px 4px;font-size:11px;color:#dbeafe;cursor:grab;touch-action:pan-x pan-y;user-select:none;-webkit-user-select:none}
.chip .face-sm{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:11px;flex:0 0 22px}
.chip small{color:#8fa6c6;font-size:10px}
.chip.absent{opacity:.45;cursor:not-allowed}
.chip.is-source{opacity:.35}
.chip.assigned{border-color:#3ddc97}
.chip.waiting{border-color:#f59f00;background:#2a2113}
.chip.waiting small{color:#f59f00}
.work.drop-ok{outline:3px solid var(--good);transform:scale(1.03)}
.work.drop-no{outline:3px solid var(--bad)}
.tray.drop-ok{outline:2px dashed var(--good)}
.drag-ghost.chip{width:auto;transform:translate(-50%,-50%) scale(1.08)}
.people{display:flex;gap:3px;margin-top:5px}.avatar{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:900;cursor:grab;touch-action:pan-x pan-y}
.avatar:hover{outline:2px solid #fff;outline-offset:1px}
.drag-ghost.avatar{width:34px;height:34px;font-size:16px;border:2px solid #fff}
.avatar.is-source{opacity:.3}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tab{background:#112238;border:1px solid #294566;color:#b9cae1;padding:7px 12px;border-radius:8px;font-weight:700}
.tab.active{background:#fff;color:#0d1b2d}
.tabview{background:#fff;color:#152033;border-radius:16px;padding:14px;min-height:250px}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.member{border:1px solid #dce4ee;border-radius:12px;padding:10px;display:flex;gap:9px}
.member .face{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900}
.member small{color:#64748b}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
.chart{border:1px solid #d8e1ed;border-radius:12px;padding:10px;background:#fbfdff}
.chart h4{margin:0;font-size:13px;color:#0f172a}.chart p{font-size:11px;color:#64748b;margin:4px 0 8px;line-height:1.45}
.chart svg.cx{width:100%;height:auto;display:block}
.nodata{padding:26px 10px;text-align:center;color:#94a3b8;font-size:12px;background:#f4f8fc;border-radius:8px}
.charts{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}

function cloudConfigured(){return /^https:\/\/.+\.supabase\.co$/i.test(FLOWLAB_CLOUD.url)&&!FLOWLAB_CLOUD.url.includes('SEU-PROJETO')&&FLOWLAB_CLOUD.key&&!FLOWLAB_CLOUD.key.includes('SUA_CHAVE')}
function makeUuid(){
 if(globalThis.crypto?.randomUUID)return crypto.randomUUID();
 const a=new Uint8Array(16);(globalThis.crypto||{}).getRandomValues?.(a);
 if(!a.some(Boolean))for(let i=0;i<a.length;i++)a[i]=Math.floor(Math.random()*256);
 a[6]=(a[6]&15)|64;a[8]=(a[8]&63)|128;
 return [...a].map((b,i)=>([4,6,8,10].includes(i)?'-':'')+b.toString(16).padStart(2,'0')).join('');
}

async function ensureCloudUser(){
 if(!cloudConfigured())return null;
 if(!globalThis.supabase?.createClient)throw new Error('Biblioteca Supabase não carregou. Verifique a conexão com a internet.');
 if(!flowDb)flowDb=globalThis.supabase.createClient(FLOWLAB_CLOUD.url,FLOWLAB_CLOUD.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
 if(cloudUser)return cloudUser;
 const {data:sess,error:sessErr}=await flowDb.auth.getSession();
 if(sessErr)throw sessErr;
 if(sess?.session?.user){cloudUser=sess.session.user;return cloudUser}
 setCloudState('conectando…');
 const {data,error}=await flowDb.auth.signInAnonymously({options:{data:{app:'flowlab',version:FLOWLAB_CLOUD.appVersion}}});
 if(error)throw error;
 cloudUser=data.user;return cloudUser;
}
function cloudPayload(status='in_progress'){
 const lts=state.deliveries.map(d=>d.lt),fes=state.deliveries.map(d=>d.fe).filter(v=>v!=null);
 return {
  session_id:cloudSessionId,
  user_id:cloudUser.id,
  player_name:state.player.name,
  class_name:state.player.class,
  status,
  current_day:Math.min(DAYS,Math.max(1,state.day)),
  score:state.score,
  rank_name:rankName(),
  profit:Math.round(state.revenue-state.cost),
  revenue:state.revenue,
  cost:state.cost,
  deliveries_count:state.deliveries.length,
  p50:percentile(lts,50),
  p85:percentile(lts,85),
  avg_wip:mean(state.history.map(h=>h.wip)),
  throughput:throughput(),
  flow_efficiency:fes.length?mean(fes):null,
  debt:state.debt,
  sle:state.sle,
  history:state.history,
  deliveries:state.deliveries,
  logs:state.logs,
  achievements:state.achievements,
  state_snapshot:{cards:state.cards,wip:state.wip,policies:state.policies,assign:state.assign,subs:state.subs,revenue:state.revenue,cost:state.cost,debt:state.debt,sle:state.sle,contratacoes:state.contratacoes,absent:state.absent},

  started_at:cloudStartedAt
 };
}
async function saveCloudProgress(status='in_progress'){
 if(!cloudConfigured()){setCloudState('modo local');return false}
 try{
  await ensureCloudUser();
  if(!cloudSessionId)cloudSessionId=makeUuid();
  if(!cloudStartedAt)cloudStartedAt=new Date().toISOString();
  setCloudState('salvando…');
  const {error}=await flowDb.from('flowlab_sessions').upsert(cloudPayload(status),{onConflict:'session_id'});
  if(error)throw error;
  setCloudState(status==='completed'?'resultado salvo':'salvo no dia '+Math.min(state.day,DAYS));
  if(state.tab==='rank')loadCloudRanking(false);
  return true;
 }catch(err){
  console.error('FlowLab Cloud:',err);
  setCloudState('falha ao sincronizar');
  return false;
 }
}
function queueCloudSave(status='in_progress'){
 cloudSaveChain=cloudSaveChain.catch(()=>{}).then(()=>saveCloudProgress(status));
 return cloudSaveChain;
}
async function loadCloudRanking(rerender=true){
 if(!cloudConfigured()){cloudRankingLoaded=true;if(rerender&&state.tab==='rank')render();return}
 try{
  await ensureCloudUser();setCloudState('carregando ranking…');
  const {data,error}=await flowDb.rpc('get_flowlab_ranking',{p_class_name:state.player.class||null,p_limit:FLOWLAB_CLOUD.rankingLimit});
  if(error)throw error;
  cloudRanking=Array.isArray(data)?data:[];cloudRankingLoaded=true;setCloudState('ranking atualizado');
 }catch(err){console.error('FlowLab ranking:',err);cloudRankingLoaded=true;setCloudState('ranking indisponível')}
 if(rerender&&state.tab==='rank')render();
}

// Reconstrói o histórico dos dias 1–3 (gestão anterior, antes da passagem de bastão).
// Não inventa dados: deriva das datas de criação, compromisso e entrega que os cartões já carregam.
function seedHistory(cards){
 const idx=id=>order.indexOf(id),rd=idx('readyDev'),prodI=idx('prod'),h=[];
 for(let d=1;d<=3;d++){
  const b={day:d,wip:0,doneDay:0,backlog:0,upstream:0,dev:0,test:0,hml:0,prod:0};
  // custo fixo da equipe roda desde o dia 1 (8k/dia = os 24k iniciais em 3 dias);
  // a receita inicial de 7k veio da entrega do dia 3 (5 assinantes × 1,4).
  b.cost=TEAM_COST*d;b.revenue=(d>=3?7:0);b.profit=b.revenue-b.cost;b.subs=(d>=3?5:0);
  cards.forEach(c=>{
   let ci;
   if(c.done!=null&&d>=c.done)ci=prodI;                        // já entregue naquele dia
   else if(c.commit!=null&&c.commit<=d){                       // comprometido: progride do commit até a posição atual
    const cur=idx(c.col),span=Math.max(1,4-c.commit);
    ci=Math.round(rd+(cur-rd)*((d-c.commit)/span));
    ci=Math.max(rd,Math.min(prodI-1,ci));                      // sem entrar em produção sem entrega registrada
   }else{const cur=idx(c.col);ci=cur<rd?cur:0}                 // ainda no upstream
   const id=order[ci];
   if(id==='backlog')b.backlog++;
   else if(['refine','readyPlan','plan'].includes(id))b.upstream++;
   else if(['readyDev','dev'].includes(id))b.dev++;
   else if(['readyTest','test'].includes(id))b.test++;
   else if(['readyHml','hml'].includes(id))b.hml++;
   else b.prod++;
   if(c.commit!=null&&c.commit<=d&&!(c.done!=null&&d>=c.done))b.wip++;
   if(c.done===d)b.doneDay++;
  });
  h.push(b);
 }
 return h;
}

function predictability(){
 const lts=state.deliveries.map(d=>d.lt);
 // amostra mínima: com poucas entregas o P85/P50 é ruído e daria pontos de graça
 if(lts.length<8)return{pts:0,ratio:null,motivo:'amostra insuficiente (mín. 8 entregas)'};
 const p50=percentile(lts,50),p85=percentile(lts,85);

 const ratio=p85/p50;

 return{pts:Math.round(PRED_MAX*q),ratio,motivo:null};
}

 const tps=h.map(x=>x.doneDay||0);
 const tpMedio=tps.reduce((a,b)=>a+b,0)/dias;
 const tpVar=Math.sqrt(tps.reduce((a,b)=>a+Math.pow(b-tpMedio,2),0)/dias);
 const fes=state.deliveries.map(d=>d.fe).filter(v=>v!=null);
 const fe=fes.length?fes.reduce((a,b)=>a+b,0)/fes.length:0;
 const dentroSle=lts.filter(v=>v<=state.sle).length;
 const wipAtual=committed().filter(c=>!c.done&&c.col!=='prod');
 const maisVelho=Math.max(0,...wipAtual.map(c=>state.day-c.commit+1));
 const diasComExcesso=h.filter(x=>(x.over||0)>0).length;
 const bloqDias=state.cards.reduce((a,c)=>a+(c.blockedTotal||0),0);
 const porTipo=t=>state.deliveries.filter(d=>d.type===t).length;
 const naoPlanejado=porTipo('bug')+porTipo('expedite');
 const valorEntregue=state.deliveries.reduce((a,d)=>a+(d.value||0),0);
 // só é ladrão a dependência que trava trabalho JÁ COMPROMETIDO — no backlog ela ainda é opção
 const depsPend=state.cards.filter(c=>{if(!c.commit||c.done||c.col==='prod')return false;
  const d=c.dep?state.cards.find(x=>x.id===c.dep):null;return d&&d.col!=='prod'}).length;
 const propNaoPlan=state.deliveries.length?naoPlanejado/state.deliveries.length:0;
 return {lts,p50,p85,p95,ratio:(p50&&p85)?p85/p50:null,wipMedio,tpMedio,tpVar,
  cv:tpMedio?tpVar/tpMedio:null,fe,dentroSle,total:lts.length,
  sleRate:lts.length?dentroSle/lts.length:0,maisVelho,diasComExcesso,dias,bloqDias,
  naoPlanejado,propNaoPlan,porTipo,valorEntregue,depsPend,wipAtual:wipAtual.length,
  little:tpMedio?wipMedio/tpMedio:null};
}

function trilha(s){
 const p=[];
 if(s.fe<.3)p.push({t:'Reduza o WIP antes de qualquer outra coisa',d:'Sua eficiência de fluxo indica que a maior parte do tempo é espera. Nenhuma outra melhoria rende tanto quanto cortar trabalho iniciado em excesso.'});
 if(s.ratio&&s.ratio>2.3)p.push({t:'Separe classes de trabalho e refaça os percentis',d:'Cauda longa costuma ser um tipo específico de item disfarçado no meio dos demais.'});
 if(state.debt>4)p.push({t:'Reserve capacidade fixa para débito técnico',d:'O débito não cobra juros no futuro abstrato: ele cobra em bugs e lentidão hoje.'});
 if(s.diasComExcesso/Math.max(1,s.dias)>.3)p.push({t:'Trate limites de WIP como política, não sugestão',d:'Sem limite respeitado não existe sistema puxado.'});
 if(s.maisVelho>state.sle)p.push({t:'Adote a caminhada da direita para a esquerda',d:'Terminar o que está mais perto do cliente antes de começar qualquer coisa nova.'});
 if(!p.length)p.push({t:'Experimente restringir ainda mais o WIP',d:'Seu fluxo está saudável. O próximo aprendizado vem de testar o limite: reduza os limites em uma unidade e observe onde o sistema quebra.'});
 return p.slice(0,4);
}

   Contratar não é um botão de "mais capacidade". Custa taxa de recrutamento, custo diário permanente,
   e a pessoa nova leva dias para render — consumindo tempo de quem já está produzindo (efeito Brooks). */

// produtividade da pessoa hoje (0 a 1), considerando a curva de adaptação
function rampa(p){
 if(!p.desde)return 1;
 const d=state.day-p.desde;
 if(d>=RAMP_DIAS)return 1;
 return RAMP_INICIAL+(1-RAMP_INICIAL)*(d/RAMP_DIAS);
}
function emAdaptacao(p){return p.desde&&(state.day-p.desde)<RAMP_DIAS}
function precisaMentoria(p){return p.desde&&(state.day-p.desde)<MENTORIA_DIAS}
function custoDiario(){return people.reduce((a,p)=>a+(p.custo||1.2),0)}
function contratar(id){
 const cand=candidatos.find(c=>c.id===id);
 if(!cand||people.find(p=>p.id===id))return;
 if(state.day>DAYS-RAMP_DIAS){
  toast('Faltam menos de '+RAMP_DIAS+' dias: a pessoa não teria tempo de render antes do fim. Contratação no fim do projeto é custo sem retorno.','bad');
  return;
 }
 people.push(Object.assign({},cand,{desde:state.day}));
 state.cost+=cand.taxa;
 state.contratacoes=(state.contratacoes||[]).concat([{id:cand.id,name:cand.name,role:cand.role,dia:state.day,taxa:cand.taxa,custo:cand.custo}]);
 log(`Contratação: ${cand.name} (${cand.role}) — taxa de R$ ${cand.taxa}k e R$ ${cand.custo}k/dia a partir de agora.`);
 toast(`👋 <b>${cand.name}</b> entrou no time. Rende ${Math.round(RAMP_INICIAL*100)}% hoje e chega a 100% em ${RAMP_DIAS} dias — e nos primeiros ${MENTORIA_DIAS} dias consome tempo de quem ensina.`,'good');
 render();
}

function custoValorReport(){
 const valor=state.deliveries.reduce((a,d)=>a+(d.value||0),0);
 const taxas=(state.contratacoes||[]).reduce((a,c)=>a+c.taxa,0);
 const diasPessoa=state.history.reduce((a,h)=>a+(h.pessoas||people.length),0);
 const custoPessoas=state.history.reduce((a,h)=>a+(h.custoDia||custoDiario()),0);
 const custoTotal=state.cost;
 const outros=Math.max(0,custoTotal-custoPessoas-taxas);
 const roi=custoTotal?state.revenue/custoTotal:0;
 const porItem=state.deliveries.length?custoTotal/state.deliveries.length:0;
 const porDiaPessoa=diasPessoa?valor/diasPessoa:0;
 const k=roi>=2?'good':roi>=1.2?'warn':'bad';
 return {valor,taxas,diasPessoa,custoPessoas,custoTotal,outros,roi,porItem,porDiaPessoa,k};
}
function custoValorChart(){
 const d=state.history;
 if(d.length<2)return noData();
 const maxV=Math.max(...d.map(x=>Math.max(x.valorAcum||0,x.cost||0)),1);
 const a=axes({xMin:d[0].day,xMax:d[d.length-1].day,yMin:0,yMax:maxV*1.08,
  title:'Custo do time × Valor entregue',xTitle:'dia',yTitle:'R$ mil',fmtY:v=>Math.round(v)+'k'});
 let s=a.open+a.bg;
 const ln=(k,cor,dash)=>`<polyline fill="none" stroke="${cor}" stroke-width="2.5" ${dash?'stroke-dasharray="5 4"':''} points="${d.map(x=>`${a.X(x.day)},${a.Y(x[k]||0)}`).join(' ')}"/>`;
 s+=`<polygon fill="#3ddc9718" points="${d.map(x=>`${a.X(x.day)},${a.Y(x.valorAcum||0)}`).join(' ')} ${a.X(d[d.length-1].day)},${a.Y(0)} ${a.X(d[0].day)},${a.Y(0)}"/>`;
 s+=ln('valorAcum','#16a34a')+ln('cost','#e03131',1);
 // marca contratações
 (state.contratacoes||[]).forEach(c=>{
  s+=`<line x1="${a.X(c.dia)}" y1="${MT}" x2="${a.X(c.dia)}" y2="${CH-MB}" stroke="#7048e8" stroke-dasharray="3 3"/>`+
     `<text x="${a.X(c.dia)+3}" y="${MT+11}" fill="#7048e8" font-size="9">+${c.name}</text>`;
 });
 // linha de pessoas (eixo próprio, normalizado)
 const maxP=Math.max(...d.map(x=>x.pessoas||7),1);
 s+=`<polyline fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2 3" points="${d.map(x=>`${a.X(x.day)},${a.Y((x.pessoas||7)/maxP*maxV*.25)}`).join(' ')}"/>`;
 s+=legend([{c:'#16a34a',n:'valor entregue'},{c:'#e03131',n:'custo acumulado'},{c:'#94a3b8',n:'tamanho do time (escala relativa)'}],ML+6,MT+2);
 return s+a.close;
}

/* ===== Motor de gráficos: escalas, eixos com valores e rótulos ===== */
const CW=660,CH=290,ML=54,MR=22,MT=30,MB=48;
function niceStep(range,target){
 const raw=range/Math.max(1,target),mag=Math.pow(10,Math.floor(Math.log10(raw||1)));
 const n=raw/mag,s=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;
 return s*mag;
}
function ticksFor(min,max,target){
 if(!(max>min))max=min+1;
 const step=niceStep(max-min,target||5),start=Math.ceil(min/step)*step,out=[];
 for(let v=start;v<=max+step*1e-6;v+=step)out.push(Math.round(v*1e6)/1e6);
 return out.length?out:[min,max];
}
function axes(o){
 const xMin=o.xMin,xMax=(o.xMax===o.xMin?o.xMin+1:o.xMax);
 const yMin=o.yMin,yMax=(o.yMax===o.yMin?o.yMin+1:o.yMax);
 const X=v=>ML+((v-xMin)/(xMax-xMin))*(CW-ML-MR);
 const Y=v=>CH-MB-((v-yMin)/(yMax-yMin))*(CH-MT-MB);
 const xt=o.xTicks||ticksFor(xMin,xMax,6),yt=o.yTicks||ticksFor(yMin,yMax,5);
 const fx=o.fmtX||(v=>String(Math.round(v))),fy=o.fmtY||(v=>String(Math.round(v)));
 let g='';
 yt.forEach(v=>{if(v<yMin-1e-9||v>yMax+1e-9)return;
  g+=`<line x1="${ML}" y1="${Y(v)}" x2="${CW-MR}" y2="${Y(v)}" stroke="#e6edf6"/><text x="${ML-8}" y="${Y(v)+4}" text-anchor="end" fill="#64748b" font-size="10">${fy(v)}</text>`});
 xt.forEach(v=>{if(v<xMin-1e-9||v>xMax+1e-9)return;
  g+=`<line x1="${X(v)}" y1="${MT}" x2="${X(v)}" y2="${CH-MB}" stroke="#f0f5fa"/><text x="${X(v)}" y="${CH-MB+16}" text-anchor="middle" fill="#64748b" font-size="10">${fx(v)}</text>`});
 g+=`<line x1="${ML}" y1="${CH-MB}" x2="${CW-MR}" y2="${CH-MB}" stroke="#94a3b8"/><line x1="${ML}" y1="${MT}" x2="${ML}" y2="${CH-MB}" stroke="#94a3b8"/>`;
 if(o.title)g+=`<text x="${ML}" y="16" fill="#0f172a" font-size="12" font-weight="700">${o.title}</text>`;
 if(o.xTitle)g+=`<text x="${(ML+CW-MR)/2}" y="${CH-8}" text-anchor="middle" fill="#475569" font-size="10">${o.xTitle}</text>`;
 if(o.yTitle)g+=`<text transform="translate(14,${(MT+CH-MB)/2}) rotate(-90)" text-anchor="middle" fill="#475569" font-size="10">${o.yTitle}</text>`;
 return {X,Y,bg:g,open:`<svg viewBox="0 0 ${CW} ${CH}" class="cx" preserveAspectRatio="xMidYMid meet">`,close:'</svg>'};
}
function legend(items,x,y){
 return items.map((it,i)=>`<g transform="translate(${x},${y+i*14})"><rect width="10" height="10" rx="2" fill="${it.c}"/><text x="15" y="9" fill="#475569" font-size="10">${it.n}</text></g>`).join('');
}

/* ===== 2. CFD ===== */
function cfdChart(){
 const data=state.history;
 if(data.length<2)return noData();

 let s=a.open+a.bg,base=new Array(data.length).fill(0);
 keys.forEach(([k,,cor])=>{
  const top=data.map((d,i)=>base[i]+(d[k]||0));

/* ===== 7. Monte Carlo — previsão para compromissos ===== */
function monteCarlo(){
 if(state._mc&&state._mc.day===state.day)return state._mc.data;
 const amostras=state.history.map(s=>s.doneDay||0);
 const diasRestantes=Math.max(0,DAYS-state.day+1);
 if(amostras.length<3||diasRestantes<1){state._mc={day:state.day,data:null};return null}
 const res=[];
 for(let t=0;t<3000;t++){let n=0;for(let d=0;d<diasRestantes;d++)n+=amostras[Math.floor(Math.random()*amostras.length)];res.push(n)}
 res.sort((x,y)=>x-y);
 const q=p=>res[Math.min(res.length-1,Math.floor(res.length*p/100))];
 // Para previsão de QUANTIDADE, o compromisso seguro usa o percentil BAIXO:
 // 85% das simulações entregam pelo menos q(15). O percentil alto é o cenário otimista.
 const data={res,diasRestantes,mediana:q(50),conf85:q(15),conf95:q(5),otimista:q(85)};
 state._mc={day:state.day,data};return data;
}
function monteCarloChart(){
 const mc=monteCarlo();
 if(!mc)return noData('Precisa de mais dias de histórico para simular.');
 const max=Math.max(...mc.res),min=Math.min(...mc.res),bins={};
 mc.res.forEach(v=>bins[v]=(bins[v]||0)+1);
 const keys=Object.keys(bins).map(Number).sort((x,y)=>x-y);
 const maxC=Math.max(...keys.map(k=>bins[k]));
 const a=axes({xMin:min-0.5,xMax:max+1.5,yMin:0,yMax:maxC*1.25,
  title:`Monte Carlo — quantos itens ainda entregam em ${mc.diasRestantes} dia(s)`,
  xTitle:'itens adicionais entregues até o fim',yTitle:'frequência (3000 simulações)',fmtY:v=>''});
 let s=a.open+a.bg;
 const bw=Math.max(4,(a.X(1)-a.X(0))*0.78);
 keys.forEach(k=>{const n=bins[k],y=a.Y(n);
  const cor=k<mc.conf85?'#94a3b8':k<=mc.mediana?'#2563eb':'#3ddc97';
  s+=`<rect x="${a.X(k)-bw/2}" y="${y}" width="${bw}" height="${a.Y(0)-y}" fill="${cor}" fill-opacity=".85" rx="2"><title>${k} itens em ${(n/mc.res.length*100).toFixed(1)}% das simulações</title></rect>`});
 const mark=(v,cor,txt,dy)=>`<line x1="${a.X(v)}" y1="${MT}" x2="${a.X(v)}" y2="${CH-MB}" stroke="${cor}" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${a.X(v)+3}" y="${MT+(dy||10)}" fill="${cor}" font-size="10">${txt}</text>`;
 s+=mark(mc.conf85,'#e03131','85% de confiança: ≥ '+mc.conf85,10);
 s+=mark(mc.mediana,'#2563eb','mediana: '+mc.mediana,24);
 s+=`<text x="${ML+4}" y="${CH-MB-6}" fill="#475569" font-size="10">Compromissos vão pelo ≥ ${mc.conf85} (85% de confiança), não pela mediana de ${mc.mediana}.</text>`;
 return s+a.close;
}

function depBlocked(c,target){
 if(!c.dep||target!=='dev')return null;

 if(!d||d.col==='prod')return null;
 return d;

function canMove(c){
 const n=next(c.col);if(!n)return false;const cm=col(c.col);if(cm.type==='active'&&c.rest[cm.stage]>0)return false;if(c.blocked)return false;
 if(depBlocked(c,n))return false;
 const lim=state.wip[n],count=state.cards.filter(x=>x.col===n).length,ignore=state.day<=state.policies.noLimitsUntil||c.type==='expedite'||c.type==='bug';
 return col(n).type==='done'||ignore||!lim||count<lim;
}
let _toastT=null;

 const d=document.createElement('div');d.className='toast'+(kind?' '+kind:'');d.innerHTML=msg;document.body.appendChild(d);
 clearTimeout(_toastT);_toastT=setTimeout(()=>{d.remove()},2600);
}
// Explica POR QUE um item pode ou não ser puxado — mesma regra de canMove(), com diagnóstico.
function moveReason(c,targetId){
 const n=next(c.col);
 if(!n)return{ok:false,msg:'<b>'+c.name+'</b> já está em Produção.'};
 if(targetId&&targetId!==n){
   if(targetId===c.col)return{ok:false,silent:true};
   return{ok:false,msg:'Sistema puxado: o item avança uma etapa por vez. O próximo passo de <b>'+c.name+'</b> é <b>'+col(n).name+'</b>.'};
 }
 const cm=col(c.col);
 if(c.blocked)return{ok:false,msg:'⛔ <b>'+c.name+'</b> está bloqueado por mais '+c.blocked+' dia(s). Impedimento visível é impedimento a resolver — nada flui daqui.'};
 const dep=depBlocked(c,n);
 if(dep)return{ok:false,msg:'🔗 <b>'+c.name+'</b> depende de <b>'+dep.name+'</b>, que ainda está em '+col(dep.col).name+'. Dependência não resolvida vira fila.'};
 if(cm.type==='active'&&c.rest[cm.stage]>0)return{ok:false,msg:'<b>'+c.name+'</b> ainda tem <b>'+c.rest[cm.stage]+'</b> de esforço em '+cm.name+'. Aloque pessoas e encerre o dia.'};
 const lim=state.wip[n],count=state.cards.filter(x=>x.col===n).length,ignore=state.day<=state.policies.noLimitsUntil||c.type==='expedite'||c.type==='bug';
 if(!(col(n).type==='done'||ignore||!lim||count<lim))
   return{ok:false,msg:'WIP de <b>'+col(n).name+'</b> esgotado ('+count+'/'+lim+'). Puxe algo de lá primeiro — ou decida conscientemente elevar o limite.'};
 return{ok:true,to:n};
}
function moveCard(id,targetId){
 const c=state.cards.find(x=>x.id===id);if(!c)return;
 const r=moveReason(c,targetId);
 if(!r.ok){if(!r.silent)toast(r.msg,'bad');return}
 c.col=r.to;c.colSince=state.day;if(c.col==='readyDev'&&!c.commit)c.commit=state.day;
 if(c.col==='prod')toast('🚀 <b>'+c.name+'</b> chegou à Produção.','good');
 else if(col(c.col).type==='queue'&&criterios[c.col])
  toast('✅ <b>'+col(c.col).name+'</b> — ao mover, você declara: '+criterios[c.col].resumo+' <i>(toque no ✓ da coluna para ver os critérios)</i>');
 render();
}
// Regras de alocação — espelham a aba Equipe (ausência, silo, colunas ativas)
function assignReason(p,c){
 if(state.absent[p.id]&&state.day<=state.absent[p.id])
   return{ok:false,msg:'<b>'+p.name+'</b> está ausente hoje. Ninguém aloca quem não está.'};
 const cm=col(c.col);
 if(cm.type!=='active'||c.done)
   return{ok:false,msg:'Pessoas só trabalham em colunas de atividade (Refinamento, Planejamento, Dev, Teste, Homologação). Filas não consomem esforço.'};
 if(state.day<=state.policies.siloUntil&&!p.spec.includes(c.col))
   return{ok:false,msg:'Política de silo ativa: <b>'+p.name+'</b> ('+p.role+') só pode atuar em sua especialidade.'};
 return{ok:true};
}

}

function endDay(){
 let dailyDone=0;state.cost+=custoDiario();
 // Eficiência de fluxo honesta: item em coluna ativa SEM ninguém alocado é espera, não trabalho.
 const trabalhadosHoje=new Set(people.filter(p=>!(state.absent[p.id]&&state.day<=state.absent[p.id]))
   .map(p=>state.assign[p.id]).filter(Boolean));
 committed().forEach(c=>{const cm=col(c.col);
  if(cm.type==='active'&&!c.blocked&&trabalhadosHoje.has(c.id))c.touch++;
  else{c.wait++;if(cm.type==='active'&&!c.blocked)c.ocioso=(c.ocioso||0)+1}
  if(c.blocked)c.blockedTotal=(c.blockedTotal||0)+1});
 // efeito Brooks: quem está em adaptação consome tempo de um veterano da mesma especialidade
 const mentores=new Set();
 people.filter(p=>precisaMentoria(p)).forEach(novo=>{
  const m=people.find(v=>!v.desde&&!mentores.has(v.id)&&v.spec.some(x=>novo.spec.includes(x)));
  if(m)mentores.add(m.id);
 });
 people.forEach(p=>{
  if(state.absent[p.id]&&state.day<=state.absent[p.id])return;
  const id=state.assign[p.id],c=state.cards.find(x=>x.id===id);if(!c||col(c.col).type!=='active'||c.blocked)return;
  let pts=rnd(1,6);if(p.spec.includes(c.col))pts*=2;if(state.day===state.policies.meetingDay)pts=Math.max(1,pts-1);
  pts=pts*rampa(p);
  if(mentores.has(p.id))pts=pts*(1-MENTORIA_PERDA);
  pts=Math.max(1,Math.round(pts));
  if(c.col==='dev')pts=Math.max(1,Math.floor(pts*(1-state.debt*.04)));
  c.rest[col(c.col).stage]=Math.max(0,c.rest[col(c.col).stage]-pts);
 });
 state.cards.forEach(c=>{
  if(c.blocked)c.blocked--;
  const cm=col(c.col);if(cm.type==='active'&&c.rest[cm.stage]===0&&canMove(c)){
    c.col=next(c.col);c.colSince=state.day;if(c.col==='readyDev'&&!c.commit)c.commit=state.day;
    if(c.col==='prod'){c.done=state.day;dailyDone++;const lt=state.day-c.commit+1,fe=c.touch/(c.touch+c.wait||1);
      // valor que esta entrega ainda vai gerar: ciclos de cobrança restantes + bônus aplicável
      const ciclos=Math.max(0,Math.floor((DAYS-state.day)/3));
      let val=(c.subs||0)*SUB_REVENUE*ciclos;
      if(c.type==='expedite'&&lt<=5)val+=c.bonus;
      if(c.type==='fixed'&&state.day<=c.due)val+=c.bonus;
      state.deliveries.push({day:state.day,name:c.name,lt,type:c.type,fe,value:val});
      if(c.type==='debt')state.debt=Math.max(0,state.debt-2);else{state.subs+=c.subs||0;if(c.type==='expedite'&&lt<=5)state.revenue+=c.bonus;if(c.type==='fixed'){if(state.day<=c.due)state.revenue+=c.bonus;else state.cost+=20}}
    }
  }
  if(c.type==='fixed'&&!c.done&&c.due&&state.day>c.due&&!c.late){c.late=true;state.cost+=20}
 });
 if(state.day%3===0){state.revenue+=state.subs*SUB_REVENUE;log(`Ciclo de cobrança: ${state.subs} assinantes geraram R$ ${(state.subs*SUB_REVENUE).toFixed(1)}k.`)}
 if(Math.random()<state.debt*.04){state.cards.push(item('bug',state.day,state.cards));log('Bug emergiu devido ao débito técnico.')}
 if(Math.random()<.08){const active=state.cards.filter(c=>col(c.col).type==='active'&&!c.done);if(active.length){const c=active[rnd(0,active.length-1)];c.blocked=rnd(1,2);log(`${c.name} ficou bloqueado.`)}}
 // DEMANDA ELÁSTICA: entregar não esvazia o backlog — atrai mais pedidos.
 // Time que entrega vira time confiável, e time confiável recebe mais trabalho.
 if(state.day%3===0)state.cards.unshift(item('standard',state.day,state.cards));   // demanda de base
 for(let i=0;i<dailyDone;i++){
  if(Math.random()<.55){state.cards.unshift(item('standard',state.day,state.cards));
   if(i===0)log('Entrega gerou nova demanda: o negócio viu o time entregando e trouxe mais pedidos.');}
 }
 // urgência espontânea: cresce com a visibilidade do time (vazão recente)
 const vazaoRec=state.history.slice(-5).reduce((a,b)=>a+(b.doneDay||0),0);
 if(dailyDone&&Math.random()<Math.min(.20,.05+vazaoRec*.03)){

function dailyBriefing(){
 const alertas=[],pauta=[];

 // percorre da direita (mais perto do cliente) para a esquerda
 const walk=order.slice().reverse().filter(id=>id!=='prod');
 walk.forEach(id=>{
  const cl=col(id),itens=state.cards.filter(c=>c.col===id&&!c.done);
  if(!itens.length&&id!=='backlog')return;

  const linhas=itens.map(c=>{
   const idade=c.commit?state.day-c.commit+1:null;
   const parado=state.day-(c.colSince||state.day);
   const flags=[];
   if(c.blocked)flags.push({t:'⛔ bloqueado por '+c.blocked+'d',k:'bad'});
   const dep=c.dep?state.cards.find(x=>x.id===c.dep):null;
   if(dep&&dep.col!=='prod')flags.push({t:'🔗 espera '+dep.name,k:'bad'});
   if(idade&&idade>state.sle)flags.push({t:'⏰ '+idade+'d — acima do SLE',k:'bad'});
   else if(idade&&p85&&idade>p85)flags.push({t:'⏳ '+idade+'d — passou do P85',k:'warn'});
   if(cl.type==='queue'&&parado>=2)flags.push({t:'🧊 parado há '+parado+'d nesta fila',k:'warn'});
   if(cl.type==='active'&&c.rest[cl.stage]>0)flags.push({t:'esforço restante '+c.rest[cl.stage],k:'muted'});
   if(cl.type==='active'&&c.rest[cl.stage]===0)flags.push({t:'✅ concluído aqui — pode ser puxado',k:'good'});
   if(maturity(c)===0&&id!=='backlog')flags.push({t:'🌱 ainda sem refinamento de negócio',k:'muted'});
   return{c,idade,parado,flags};
  });
  // perguntas de fluxo por coluna
  let pergunta='';
  if(cl.type==='queue'&&itens.length){
   const prontos=linhas.filter(l=>!l.c.blocked).length;
   if(lim&&limAtivo&&itens.length>=lim)pergunta=`Fila cheia (${itens.length}/${lim}). Nada mais entra aqui até algo sair. O gargalo está à frente.`;
   else if(prontos)pergunta=`${prontos} item(ns) aguardando ser puxado(s). Há capacidade adiante?`;
  }
  if(cl.type==='active'){
   if(!itens.length)pergunta='Etapa ociosa — a jusante fica sem alimentação em breve.';
   else{
    const prontos=linhas.filter(l=>l.c.rest[cl.stage]===0&&!l.c.blocked).length;
    if(prontos)pergunta=`${prontos} item(ns) já concluído(s) nesta etapa: puxe adiante antes de começar outro.`;
   }

 });
 // alertas priorizados (o que decidir hoje)
 const wip=committed().filter(c=>!c.done&&c.col!=='prod');
 const bloq=wip.filter(c=>c.blocked);
 if(bloq.length)alertas.push({k:'bad',t:`${bloq.length} item(ns) bloqueado(s)`,d:'Impedimento é a prioridade número um: enquanto durar, nenhum esforço aplicado ali vira entrega. '+bloq.map(c=>c.name).join(', ')+'.'});
 const velhos=wip.filter(c=>c.commit&&state.day-c.commit+1>state.sle).sort((a,b)=>a.commit-b.commit);
 if(velhos.length)alertas.push({k:'bad',t:`${velhos.length} item(ns) acima do SLE de ${state.sle}d`,d:'Item velho não melhora sozinho. Concentre esforço para terminar antes de começar qualquer coisa nova: '+velhos.slice(0,3).map(c=>c.name+' ('+(state.day-c.commit+1)+'d)').join(', ')+'.'});
 const deps=wip.filter(c=>{const d=c.dep?state.cards.find(x=>x.id===c.dep):null;return d&&d.col!=='prod'});

 ['dev','test','hml'].forEach(a=>{

 });

 const strengths=[],improve=[],tips=[];
 if(avgW<=8)strengths.push(`Você manteve WIP médio em ${avgW.toFixed(1)}, evitando saturação extrema.`);else improve.push(`WIP médio de ${avgW.toFixed(1)} sugere trabalho demais iniciado ao mesmo tempo.`);
 if(state.debt<=2)strengths.push(`Débito técnico final em ${state.debt}/10 protegeu capacidade e estabilidade.`);else improve.push(`Débito técnico terminou em ${state.debt}/10 e continuou cobrando juros.`);
 if(ratio&&ratio<=1.8)strengths.push(`P85/P50 de ${ratio.toFixed(1)} indica boa consistência.`);else if(ratio)improve.push(`P85/P50 de ${ratio.toFixed(1)} revela cauda longa e baixa previsibilidade.`);
 if(fe>=.35)strengths.push(`Eficiência de fluxo de ${(fe*100).toFixed(0)}%: pouco tempo perdido em espera.`);else improve.push(`Eficiência de fluxo de ${(fe*100).toFixed(0)}%: a maior parte do tempo foi espera.`);
 tips.push(`Seu throughput foi ${tp.toFixed(2)} itens/dia. Use distribuições históricas para forecast, não compromissos baseados em média.`);
 tips.push(`Na próxima partida, altere apenas uma política por vez e observe o efeito no CFD, Aging WIP e percentis.`);
 return {strengths,improve,tips,p50,p85};
}
function final(){
 const a=analysis(),profit=state.revenue-state.cost;
 return `<div class="container final"><div class="panel"><div class="brand">FLOW<b>LAB</b></div><div class="credit">Jogo criado por <b>Prof. Ari Amaral</b></div><h1>Projeto encerrado</h1><div class="scorebox"><div class="scorecard">Score<br><b>${state.score}</b></div><div class="scorecard">Rank<br><b>${rankName()}</b></div><div class="scorecard">Lucro<br><b>R$ ${profit.toFixed(0)}k</b></div><div class="scorecard">Entregas<br><b>${state.deliveries.length}</b></div><div class="scorecard">P85<br><b>${a.p85==null?'—':a.p85}d</b></div></div><div class="cvverdict cv-good" style="margin-top:12px">☁️ Sincronização: <b id="cloudFinalStatus">${escapeHtml(cloudState)}</b></div>
 ${(()=>{const pr=predictability(),inS=state.deliveries.filter(d=>d.lt<=state.sle).length,lu=Math.max(0,Math.round(state.revenue-state.cost));
 return `<table class="dtab" style="margin:14px 0"><tr><td colspan="2"><b>Composição do score</b></td></tr>
 <tr><td>Lucro (receita − custo)</td><td><b>${lu}</b></td></tr>
 <tr><td>${inS} entrega(s) dentro do SLE de ${state.sle}d × 25</td><td><b>${inS*25}</b></td></tr>
 <tr><td>Previsibilidade ${pr.ratio?'(P85/P50 = '+pr.ratio.toFixed(2)+')':'('+pr.motivo+')'}</td><td><b>${pr.pts}</b> <small class="muted">/ ${PRED_MAX}</small></td></tr>
 <tr><td><b>Total</b></td><td><b>${state.score}</b></td></tr></table>`})()}
 ${custoValorPanel()}
 <h3 style="margin-top:20px">🎓 Banca de especialistas</h3>
 <p style="font-size:12.5px;color:#475569;margin:0 0 12px">Seis lentes diferentes sobre a mesma partida. Cada especialista analisou os seus números.</p>
 ${expertPanel(true)}
 <button id="restart" class="primary">Jogar novamente</button></div></div>`;
}
/* ===== Arrastar cartões (mouse + toque) =====
   Toque: pressione e segure (~220ms) para pegar o cartão — assim o swipe continua rolando o quadro.
   Mouse: arraste direto. Clique simples continua avançando o item. */
const drag={id:null,kind:null,from:null,el:null,ghost:null,armed:false,active:false,timer:null,sx:0,sy:0,lastCol:null,raf:null,px:0,justDragged:false,lastClickId:null,lastClickAt:0};
function dragCleanup(){
 clearTimeout(drag.timer);cancelAnimationFrame(drag.raf);
 if(drag.ghost){drag.ghost.remove();drag.ghost=null}
 document.querySelectorAll('.drop-ok,.drop-no').forEach(el=>el.classList.remove('drop-ok','drop-no'));
 document.querySelectorAll('.is-source').forEach(el=>el.classList.remove('is-source'));
 document.body.classList.remove('dragging-active');
 drag.id=null;drag.kind=null;drag.from=null;drag.el=null;drag.armed=false;drag.active=false;drag.lastCol=null;
}
function dragStart(el,x,y){
 drag.active=true;document.body.classList.add('dragging-active');
 try{if(drag.pid!=null&&el.setPointerCapture)el.setPointerCapture(drag.pid)}catch(_){}
 el.classList.add('is-source');
 const g=el.cloneNode(true);g.classList.add('drag-ghost');g.classList.remove('is-source');
 document.body.appendChild(g);drag.ghost=g;moveGhost(x,y);
 if(navigator.vibrate)navigator.vibrate(12);
 autoScrollLoop();
}
function moveGhost(x,y){if(drag.ghost){drag.ghost.style.left=x+'px';drag.ghost.style.top=y+'px'}}
function elUnder(x,y,sel){
 const el=document.elementFromPoint(x,y);
 return el?el.closest(sel):null;
}
function colUnder(x,y){return elUnder(x,y,'[data-col]')}
function highlight(x,y){
 if(drag.kind==='person'){
  const p=people.find(i=>i.id===drag.id);
  const cardEl=elUnder(x,y,'[data-card]'),trayEl=elUnder(x,y,'[data-tray]');
  document.querySelectorAll('.work.drop-ok,.work.drop-no').forEach(el=>{if(el!==cardEl)el.classList.remove('drop-ok','drop-no')});
  const tray=document.querySelector('[data-tray]');if(tray)tray.classList.toggle('drop-ok',!!trayEl&&!!state.assign[drag.id]);
  if(cardEl&&p){
   const c=state.cards.find(i=>i.id===cardEl.dataset.card);
   cardEl.classList.remove('drop-ok','drop-no');
   if(c)cardEl.classList.add(assignReason(p,c).ok?'drop-ok':'drop-no');
  }
  return;
 }
 const target=colUnder(x,y),c=state.cards.find(i=>i.id===drag.id);
 if(drag.lastCol&&drag.lastCol!==target)drag.lastCol.classList.remove('drop-ok','drop-no');
 if(!target||!c){drag.lastCol=null;return}
 target.classList.remove('drop-ok','drop-no');
 if(target.dataset.col!==c.col)target.classList.add(moveReason(c,target.dataset.col).ok?'drop-ok':'drop-no');
 drag.lastCol=target;
}
function autoScrollLoop(){
 if(!drag.active)return;
 const wrap=document.querySelector('.board-wrap');
 if(wrap){const r=wrap.getBoundingClientRect(),edge=70;
  if(drag.px<r.left+edge)wrap.scrollLeft-=Math.max(6,(r.left+edge-drag.px)/4);
  else if(drag.px>r.right-edge)wrap.scrollLeft+=Math.max(6,(drag.px-(r.right-edge))/4);
 }
 drag.raf=requestAnimationFrame(autoScrollLoop);
}
function initDrag(){
 const zone=document.getElementById('flowzone');if(!zone)return;
 zone.addEventListener('pointerdown',e=>{
  if(e.target.closest('[data-info]'))return; // botão de detalhe: não arma arraste nem captura ponteiro
  const person=e.target.closest('[data-person]');
  const cardEl=person?null:e.target.closest('[data-card]');
  const el=person||cardEl;if(!el)return;
  if(person&&person.classList.contains('absent'))return; // ausente não arrasta
  drag.kind=person?'person':'card';
  drag.from=person?(person.dataset.from||'tray'):'board';
  drag.id=person?person.dataset.person:cardEl.dataset.card;
  drag.sx=e.clientX;drag.sy=e.clientY;drag.px=e.clientX;drag.armed=true;drag.justDragged=false;drag.el=el;drag.pid=e.pointerId;
  if(e.pointerType!=='mouse'){drag.timer=setTimeout(()=>{if(drag.armed)dragStart(el,drag.sx,drag.sy)},220)}
 });
 zone.addEventListener('pointermove',e=>{
  if(!drag.armed)return;
  const dx=Math.abs(e.clientX-drag.sx),dy=Math.abs(e.clientY-drag.sy);
  if(!drag.active){
   if(e.pointerType==='mouse'){if(dx>6||dy>6){if(drag.el)dragStart(drag.el,e.clientX,e.clientY)}}
   else if(dx>12||dy>12){clearTimeout(drag.timer);drag.armed=false;drag.id=null;drag.kind=null;drag.el=null} // virou rolagem
   return;
  }
  drag.px=e.clientX;moveGhost(e.clientX,e.clientY);highlight(e.clientX,e.clientY);
 });
 const finish=e=>{
  if(!drag.armed&&!drag.active)return;
  if(drag.active){
   const kind=drag.kind,id=drag.id,from=drag.from;
   const cardEl=elUnder(e.clientX,e.clientY,'[data-card]');
   const colEl=colUnder(e.clientX,e.clientY);
   const trayEl=elUnder(e.clientX,e.clientY,'[data-tray]');
   drag.justDragged=true;dragCleanup();
   if(kind==='person'){
    if(cardEl)assignPerson(id,cardEl.dataset.card);
    else if(trayEl)unassignPerson(id);
    else if(from==='card')unassignPerson(id); // puxou para fora do cartão = liberar
    else toast('Solte a pessoa sobre um cartão para alocar, ou na bancada para liberar.','bad');
   }else{
    if(colEl)moveCard(id,colEl.dataset.col);
    else toast('Solte o cartão sobre uma coluna do quadro.','bad');
   }
  }else dragCleanup();
 };
 zone.addEventListener('pointerup',finish);
 zone.addEventListener('pointercancel',()=>dragCleanup());
 // impede a rolagem nativa enquanto algo está sendo arrastado no toque
 document.addEventListener('touchmove',e=>{if(drag.active)e.preventDefault()},{passive:false});
}
function bind(){
 const s=document.getElementById('start');if(s)s.onclick=()=>{const n=document.getElementById('name').value.trim(),t=document.getElementById('class').value.trim();if(!n)return alert('Informe seu nome.');if(!t)return alert('Informe a turma. Use o mesmo código compartilhado pelo professor.');state.player={name:n,class:t};cloudSessionId=makeUuid();cloudStartedAt=new Date().toISOString();cloudRanking=[];cloudRankingLoaded=false;setCloudState(cloudConfigured()?'preparando sincronização…':'modo local');state.screen='game';state.event={person:'Rafa',role:'Agile Coach',avatar:'🧑‍🏫',title:'Passagem de bastão',text:'Você assume no dia 4 com fila de teste cheia, um item bloqueado e débito técnico em 4/10. Antes de começar mais coisas, observe o quadro.',choices:[{label:'Assumir o desafio',desc:'Abrir o quadro e diagnosticar o fluxo.',act:()=>log('Assumiu a gestão do fluxo.')} ]};render();queueCloudSave('in_progress')};
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render();if(state.tab==='rank'&&cloudConfigured())loadCloudRanking()});
 document.querySelectorAll('[data-wip]').forEach(b=>b.onclick=()=>{const id=b.dataset.wip,d=+b.dataset.delta;state.wip[id]=Math.max(1,(state.wip[id]||1)+d);render()});
 document.querySelectorAll('[data-card]').forEach(c=>{
  c.onclick=e=>{
   if(e.target.closest('[data-info]')){state.detail=c.dataset.card;render();return}
   if(e.target.closest('[data-person]'))return; // toque no avatar não avança o cartão
   if(drag.justDragged){drag.justDragged=false;return}
   const now=Date.now();
   // duplo clique dispara dois 'click': o 1º já avança; o 2º (em <350ms) é absorvido
   if(drag.lastClickId===c.dataset.card&&now-drag.lastClickAt<350)return;
   drag.lastClickId=c.dataset.card;drag.lastClickAt=now;
   moveCard(c.dataset.card);
  };
  c.ondblclick=e=>e.preventDefault(); // evita seleção de texto no duplo clique
 });
 document.querySelectorAll('[data-hire]').forEach(b=>b.onclick=()=>contratar(b.dataset.hire));
 document.querySelectorAll('[data-crit]').forEach(b=>b.onclick=e=>{e.stopPropagation();state.criterios=b.dataset.crit;render()});
 document.querySelectorAll('[data-crit-close]').forEach(b=>b.onclick=()=>{state.criterios=null;render()});
 const cbg=document.querySelector('[data-crit-bg]');if(cbg)cbg.onclick=e=>{if(e.target===cbg){state.criterios=null;render()}};
 document.querySelectorAll('[data-daily-close]').forEach(b=>b.onclick=()=>{state.daily=false;render()});
 document.querySelectorAll('[data-detail-close]').forEach(b=>b.onclick=()=>{state.detail=null;render()});
 const dbg=document.querySelector('[data-detail-bg]');
 if(dbg)dbg.onclick=e=>{if(e.target===dbg){state.detail=null;render()}};
 const od=document.getElementById('openDaily');if(od)od.onclick=()=>{state.daily=true;render()};
 initDrag();
 document.querySelectorAll('[data-assign]').forEach(s=>s.onchange=()=>{state.assign[s.dataset.assign]=s.value||null});
 const e=document.getElementById('endDay');if(e)e.onclick=endDay;
 const sm=document.getElementById('sleMinus');if(sm)sm.onclick=()=>{state.sle=Math.max(2,state.sle-1);render()};
 const sp=document.getElementById('slePlus');if(sp)sp.onclick=()=>{state.sle++;render()};
 document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const c=state.event.choices[+b.dataset.choice];c.act();state.event=null;render()});
 const rr=document.getElementById('refreshRank');if(rr)rr.onclick=()=>loadCloudRanking();
 const r=document.getElementById('restart');if(r)r.onclick=()=>{cloudSessionId=null;location.reload()};
}
render();
</script>
